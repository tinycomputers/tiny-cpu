name: Web CI

on:
  push:
    paths: ['web/**', 'sim/golden/gen_asm_fixtures.py', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'sim/golden/gen_asm_fixtures.py', '.github/workflows/web.yml']

jobs:
  web-ci:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: web
        run: pnpm lint

      - name: Type check
        working-directory: web
        run: pnpm typecheck

      # Unit and integration tests: assembler vs GNU bytes, disassembler round trip, run model, and every
      # preset on the committed WASM module (web/public/tiny_cpu.mjs, rebuilt by the WASM workflow).
      - name: Unit and integration tests
        working-directory: web
        run: pnpm test

      - name: Build
        working-directory: web
        run: pnpm build

      - name: Install Chromium for the smoke tests
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke tests (production build)
        working-directory: web
        run: pnpm test:e2e
