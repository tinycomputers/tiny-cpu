name: WASM Build

on:
  push:
    paths: ['rtl/**', 'wasm/**', '.github/workflows/wasm.yml']
  pull_request:
    paths: ['rtl/**', 'wasm/**', '.github/workflows/wasm.yml']

jobs:
  wasm-build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator and build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator build-essential

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build spike WASM
        run: bash wasm/spike/build.sh

      - name: Run spike headless
        run: node wasm/spike/test.mjs

      - name: Report artifact size
        run: |
          test -f web/public/spike/counter.wasm
          echo "spike wasm: $(du -h web/public/spike/counter.wasm | cut -f1)"
